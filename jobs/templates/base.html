{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matcher - Find Your Next Opportunity</title>
    <!-- Prebuilt Tailwind CSS (not the Play CDN, which compiles styles in the
         browser on every page load). Rebuild after changing classes in any
         template - see README "Rebuilding the CSS". -->
    <link rel="stylesheet" href="{% static 'jobs/app.css' %}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 via-blue-50 to-purple-50 text-gray-900 min-h-screen">

<!-- Navbar -->
<nav class="bg-white/80 backdrop-blur-lg shadow-lg sticky top-0 z-50 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-24 items-center">
            <div class="flex items-center space-x-4">
                <div>
                    <div class="text-3xl font-bold gradient-text">Job Matcher</div>
                    <div class="text-sm text-gray-500 font-medium -mt-1">Smart Career Connections</div>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="py-6">
    {% block content %}
    {% endblock %}
</main>

<!-- Footer -->
<footer class="bg-white/80 backdrop-blur-lg border-t border-gray-100 py-4 mt-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-gray-600 text-xs">&copy; 2025 Job Matcher. All rights reserved.</p>
    </div>
</footer>

</body>
</html>
