services:
  - type: web
    name: job-matching-website
    env: python
    # Closest Render region to both the Supabase database (ap-northeast-2,
    # Seoul) and this site's users in Cambodia. Without this Render defaults
    # to Oregon, which puts a trans-Pacific round trip on every DB query.
    # Note: Render can't move an existing service between regions - a new
    # service has to be created for this to take effect.
    region: singapore
    # Cheap endpoint that touches neither the DB nor the ML model (see
    # jobs.views.healthz); also the URL to point an uptime pinger at.
    healthCheckPath: /healthz
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --config gunicorn.conf.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: job-matching-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"

databases:
  - name: job-matching-db
    databaseName: job_matching_db
    user: job_matching_user
